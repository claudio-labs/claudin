name: CI personal

on:
  push:
    branches:
      - personal

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch personal \
            "http://gitea-actions:${GITEA_TOKEN}@git.house.server:3000/${GITHUB_REPOSITORY}.git" \
            .

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke
        run: bun run smoke

      - name: Unit tests
        run: bun test --max-concurrency=1

      - name: codexOAuth diagnostic (always runs)
        if: always()
        run: bun test src/services/api/codexOAuth.test.ts 2>&1 || true

      - name: Provider tests
        run: bun run test:provider

      - name: Install Python dependencies
        run: |
          curl -sS https://bootstrap.pypa.io/pip/3.9/get-pip.py | python3
          python3 -m pip install -r python/requirements.txt

      - name: Python tests
        run: python3 -m pytest -q python/tests
