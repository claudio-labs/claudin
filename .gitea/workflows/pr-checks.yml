name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          REPO_URL: http://git.house.server:3000/${{ github.repository }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          rm -rf .git
          git init -q
          git remote add origin "$REPO_URL"
          git -c http.extraheader="AUTHORIZATION: bearer $GITEA_TOKEN" fetch -q --no-tags origin
          git checkout -q "${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke check
        run: bun run smoke

      - name: Full unit test suite (isolated per-file to avoid mock.module leaks)
        run: |
          set -u
          fail=0
          total=0
          for f in $(find src -name '*.test.ts' -not -name '*.skip.test.ts' | sort); do
            total=$((total+1))
            echo "::group::$f"
            if ! bun test "$f" --max-concurrency=1; then
              fail=$((fail+1))
              echo "FAIL: $f"
            fi
            echo "::endgroup::"
          done
          echo "Total: $total files, $fail failed"
          test "$fail" -eq 0

      - name: Provider tests
        run: bun run test:provider

      - name: Privacy invariant
        run: bun run verify:privacy
