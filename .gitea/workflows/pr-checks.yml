name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GITEA_REPO_URL: http://git.house.server:3000/${{ github.repository }}

jobs:
  smoke-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          rm -rf .git
          git init -q
          git remote add origin "$GITEA_REPO_URL"
          git -c http.extraheader="AUTHORIZATION: bearer $GITEA_TOKEN" fetch -q --no-tags origin
          git checkout -q "${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          echo "bun path: $(which bun)"
          echo "bun version: $(bun --version)"
          bun install --frozen-lockfile

      - name: Smoke check
        run: bun run smoke