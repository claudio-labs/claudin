name: Publish to npm

# Manual-only. Run after release.yml has tagged a version + created the
# Gitea release. This workflow trusts that release.yml validated the code
# (tests, smoke, privacy) and only does the bare minimum to ship: install
# deps, build the bundle, npm publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex: v0.1.2)'
        required: true
        type: string

concurrency:
  group: publish-npm-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GITEA_REPO_URL: http://git.house.server:3000/${{ github.repository }}

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          rm -rf .git
          git init -q
          git remote add origin "$GITEA_REPO_URL"
          git -c http.extraheader="AUTHORIZATION: bearer $GITEA_TOKEN" fetch -q --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout -q "$TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `npm publish` triggers the `prepack` script, which runs
      # `build:release` (CLAUDIO_RELEASE_BUILD=1). Running a separate
      # `bun run build` before publish would produce dev-mode chunks that
      # survive into the tarball alongside the release chunks (the dist/
      # chunks dir was kept across rebuilds for local-CLI safety). Trust
      # prepack to build — single source of truth for the published bundle.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish summary
        run: |
          {
            echo "## Published ${{ inputs.tag }}"
            echo
            echo "- npm: https://www.npmjs.com/package/@claudiolabs/claudio"
            echo "- install: \`npm install -g @claudiolabs/claudio\`"
          } >> "$GITHUB_STEP_SUMMARY"
