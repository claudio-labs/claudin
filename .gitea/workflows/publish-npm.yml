name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: publish-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }} to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        env:
          GITHUB_SERVER_URL: http://git.house.server:3000
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test --max-concurrency=1

      - name: Smoke + build
        run: bun run smoke

      - name: Privacy invariant
        run: bun run verify:privacy

      - name: Dry-run package
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish summary
        run: |
          {
            echo "## Published ${{ github.event.release.tag_name }}"
            echo
            echo "- npm: https://www.npmjs.com/package/@viudes/claudio"
            echo "- install: \`npm install -g @viudes/claudio\`"
          } >> "$GITHUB_STEP_SUMMARY"
