name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex: v0.1.1)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-npm-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GITEA_REPO_URL: http://git.house.server:3000/${{ github.repository }}

jobs:
  publish:
    name: Publish ${{ inputs.tag || github.ref_name }} to npm
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "No tag resolved (inputs.tag and github.ref_name both empty)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Checkout release tag
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          rm -rf .git
          git init -q
          git remote add origin "$GITEA_REPO_URL"
          git -c http.extraheader="AUTHORIZATION: bearer $GITEA_TOKEN" fetch -q --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout -q "$TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (isolated per-file to avoid mock.module leaks)
        run: |
          set -u
          fail=0
          total=0
          for f in $(find src -name '*.test.ts' -not -name '*.skip.test.ts' | sort); do
            total=$((total+1))
            if ! bun test "$f" --max-concurrency=1; then
              fail=$((fail+1))
              echo "FAIL: $f"
            fi
          done
          echo "Total: $total files, $fail failed"
          test "$fail" -eq 0

      - name: Smoke + build
        run: bun run smoke

      - name: Privacy invariant
        run: bun run verify:privacy

      - name: Dry-run package
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish summary
        run: |
          {
            echo "## Published ${{ steps.tag.outputs.tag }}"
            echo
            echo "- npm: https://www.npmjs.com/package/@viudes/claudio"
            echo "- install: \`npm install -g @viudes/claudio\`"
          } >> "$GITHUB_STEP_SUMMARY"
