name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de bump semver (none mantém a versão atual — útil pro primeiro release)'
        required: true
        type: choice
        default: patch
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

env:
  GITEA_BASE_URL: http://git.house.server:3000
  GITEA_REPO_URL: http://git.house.server:3000/${{ github.repository }}
  GITEA_API_BASE: http://git.house.server:3000/api/v1/repos/${{ github.repository }}

jobs:
  release:
    name: Bump, tag, and create Gitea release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          rm -rf .git
          git init -q
          git remote add origin "http://oauth2:${GITEA_TOKEN}@${GITEA_BASE_URL#http://}/${{ github.repository }}"
          git fetch -q --tags origin
          git checkout -q "${{ github.sha }}"

      - name: Configure git identity
        run: |
          git config user.name "claudio-release-bot"
          git config user.email "release@claudio.local"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq jq
          fi
          jq --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (isolated per-file to avoid mock.module leaks)
        run: |
          set -u
          fail=0
          total=0
          for f in $(find src -name '*.test.ts' -not -name '*.skip.test.ts' | sort); do
            total=$((total+1))
            if ! bun test "$f" --max-concurrency=1; then
              fail=$((fail+1))
              echo "FAIL: $f"
            fi
          done
          echo "Total: $total files, $fail failed"
          test "$fail" -eq 0

      - name: Smoke + build
        run: bun run smoke

      - name: Privacy invariant
        run: bun run verify:privacy

      - name: Resolve version
        id: bump
        run: |
          if [ "${{ inputs.bump }}" = "none" ]; then
            CURRENT=$(node -p "require('./package.json').version")
            NEW_TAG="v${CURRENT}"
            echo "Keeping current version ${NEW_TAG}"
          else
            NEW_TAG=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
            echo "Bumped to ${NEW_TAG}"
          fi
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty='- %s (%h)' --no-merges)
          else
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty='- %s (%h)' --no-merges)
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "## ${{ steps.bump.outputs.tag }}"
            echo
            if [ -z "$COMMITS" ]; then
              echo "_No user-facing commits since previous tag._"
            else
              echo "$COMMITS"
            fi
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Commit (when bumped), tag, push
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          if [ "${{ inputs.bump }}" != "none" ]; then
            git add package.json
            git commit -m "chore(release): ${TAG}"
            git push origin HEAD:refs/heads/main
          fi
          # Idempotent tag: skip if already on remote (release.yml may have
          # failed mid-flow on a previous attempt and we want to retry without
          # manual cleanup).
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on remote, skipping push"
          else
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create or fetch Gitea release (idempotent)
        id: create_release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          BODY: ${{ steps.changelog.outputs.body }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg name "$TAG" \
            --arg body "$BODY" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')
          RESPONSE=$(curl -sS -X POST "$GITEA_API_BASE/releases" \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            # Probably already exists — fetch it by tag.
            EXISTING=$(curl -sS \
              "$GITEA_API_BASE/releases/tags/$TAG" \
              -H "Authorization: token $GITEA_TOKEN")
            RELEASE_ID=$(echo "$EXISTING" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ]; then
              echo "Failed to create or fetch release:"
              echo "$RESPONSE"
              echo "$EXISTING"
              exit 1
            fi
            echo "Reusing existing Gitea release id=$RELEASE_ID for $TAG"
          else
            echo "Created Gitea release id=$RELEASE_ID"
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Attach bundle as release asset
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          # With code-splitting, dist/cli.mjs is a 10 KB facade that imports
          # 412 chunks from dist/chunks/. Shipping cli.mjs alone would yield
          # a broken binary, so we tar the whole dist/ (excluding sourcemaps).
          TARBALL="dist-${TAG}.tar.gz"
          tar --exclude='*.map' -czf "$TARBALL" -C dist .
          curl -sS -X POST \
            "$GITEA_API_BASE/releases/$RELEASE_ID/assets?name=${TARBALL}" \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@${TARBALL}" \
            | jq -r '.browser_download_url // .message // .'

      - name: Set up Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Idempotent: skip if this version is already published.
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} already on npm, skipping publish"
          else
            npm publish --access public
            echo "Published ${PKG_NAME}@${PKG_VERSION}"
          fi

      - name: Release summary
        run: |
          {
            echo "## Released ${{ steps.bump.outputs.tag }}"
            echo
            echo "- Tag: ${{ steps.bump.outputs.tag }}"
            echo "- Version: ${{ steps.bump.outputs.version }}"
            echo "- Release page: ${GITEA_REPO_URL}/releases/tag/${{ steps.bump.outputs.tag }}"
            echo "- npm: https://www.npmjs.com/package/@viudes/claudio"
            echo "- install: \`npm install -g @viudes/claudio@${{ steps.bump.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
