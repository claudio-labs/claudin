name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de bump semver (none mantém a versão atual — útil pro primeiro release)'
        required: true
        type: choice
        default: patch
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, and create Gitea release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "claudio-release-bot"
          git config user.email "release@claudio.local"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test --max-concurrency=1

      - name: Smoke + build
        run: bun run smoke

      - name: Privacy invariant
        run: bun run verify:privacy

      - name: Resolve version
        id: bump
        run: |
          if [ "${{ inputs.bump }}" = "none" ]; then
            CURRENT=$(node -p "require('./package.json').version")
            NEW_TAG="v${CURRENT}"
            echo "Keeping current version ${NEW_TAG}"
          else
            NEW_TAG=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
            echo "Bumped to ${NEW_TAG}"
          fi
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty='- %s (%h)' --no-merges)
          else
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty='- %s (%h)' --no-merges)
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "## ${{ steps.bump.outputs.tag }}"
            echo
            if [ -z "$COMMITS" ]; then
              echo "_No user-facing commits since previous tag._"
            else
              echo "$COMMITS"
            fi
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Commit (when bumped), tag, push
        run: |
          if [ "${{ inputs.bump }}" != "none" ]; then
            git add package.json
            git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
            git push origin HEAD
          fi
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create Gitea release
        id: create_release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          API_BASE: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BODY: ${{ steps.changelog.outputs.body }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg name "$TAG" \
            --arg body "$BODY" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')
          RESPONSE=$(curl -sS -X POST "$API_BASE/releases" \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "Failed to create release:"
            echo "$RESPONSE"
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Created Gitea release id=$RELEASE_ID"

      - name: Attach bundle as release asset
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          API_BASE: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          curl -sS -X POST \
            "$API_BASE/releases/$RELEASE_ID/assets?name=cli.mjs" \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@dist/cli.mjs" \
            | jq -r '.browser_download_url // .'

      - name: Release summary
        run: |
          {
            echo "## Released ${{ steps.bump.outputs.tag }}"
            echo
            echo "- Tag: ${{ steps.bump.outputs.tag }}"
            echo "- Version: ${{ steps.bump.outputs.version }}"
            echo "- Release page: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.bump.outputs.tag }}"
            echo
            echo "A esteira **Publish to npm** será disparada automaticamente assim que o release for publicado."
          } >> "$GITHUB_STEP_SUMMARY"
