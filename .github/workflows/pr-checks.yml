name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # From .node-version, which holds the engines floor (22.12.0). PR CI
          # runs the OLDEST supported Node on purpose: a `node-version: 22`
          # here would silently track the latest 22.x and let a PR use an API
          # the floor does not have. The release workflows deliberately differ
          # — see the note beside their `node-version: 24`.
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: |
          echo "bun path: $(which bun)"
          echo "bun version: $(bun --version)"
          bun install --frozen-lockfile

      # Not `bun run typecheck`: tsc does not come back clean here and is not
      # going to — two thirds of its output is in the checked-in React-Compiler
      # component sources, whose pre-compiler originals do not exist in this
      # fork. The ratchet fails the PR for the errors it ADDS, measured against
      # typecheck-baseline.json. See scripts/verify/typecheck-ci.ts.
      - name: Typecheck (new errors only)
        run: bun run typecheck:ci

      - name: Verify generated SDK types are in sync
        run: bun run verify:sdk-types

      # Rules are injected into context with no validation, so a rule that
      # matches nothing (never loads) or uses an unsupported frontmatter key
      # (loads into every session) is invisible at runtime. See
      # src/memory/instructions/rulesLint.ts.
      - name: Verify rule files
        run: bun run verify:rules

      # Two gates, because default-mode knip counts a module imported only by
      # its own *.test.ts as USED — which is how five dead modules survived the
      # gate until PR #211 found them by hand. Production mode drops the test
      # entries and reports them. It depends on the `!` production suffixes in
      # knip.json: without them it analyzes zero files and calls all 57
      # dependencies unused. Both run in ~2s and need no build.
      - name: Dead code
        run: bun run deadcode:ci

      - name: Dead code (production reachability)
        run: bun run deadcode:prod

      # The third dimension, and the one neither gate above has ever looked at:
      # `--include` is an allowlist, so `exports` and `types` were simply absent
      # from CI, which is how ~1300 unused exports accumulated behind a green
      # gate. The starting number is four figures, so this one is a ratchet
      # against knip-baseline.json rather than a hard zero — it fails a PR only
      # for what it ADDS. See scripts/verify/deadcode-ci.ts.
      - name: Dead code (new unused exports only)
        run: bun run deadcode:exports

      - name: Smoke check
        run: bun run smoke

      - name: Run tests
        run: bun test
