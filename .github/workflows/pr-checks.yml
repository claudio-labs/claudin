name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # From .node-version, which holds the engines floor (22.12.0). PR CI
          # runs the OLDEST supported Node on purpose: a `node-version: 22`
          # here would silently track the latest 22.x and let a PR use an API
          # the floor does not have. The release workflows deliberately differ
          # — see the note beside their `node-version: 24`.
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: |
          echo "bun path: $(which bun)"
          echo "bun version: $(bun --version)"
          bun install --frozen-lockfile

      # Not `bun run typecheck`: tsc does not come back clean here and is not
      # going to — two thirds of its output is in the checked-in React-Compiler
      # component sources, whose pre-compiler originals do not exist in this
      # fork. The ratchet fails the PR for the errors it ADDS, measured against
      # typecheck-baseline.json. See scripts/typecheck-ci.ts.
      - name: Typecheck (new errors only)
        run: bun run typecheck:ci

      - name: Verify generated SDK types are in sync
        run: bun run verify:sdk-types

      # Rules are injected into context with no validation, so a rule that
      # matches nothing (never loads) or uses an unsupported frontmatter key
      # (loads into every session) is invisible at runtime. See
      # src/utils/rulesLint.ts.
      - name: Verify rule files
        run: bun run verify:rules

      - name: Smoke check
        run: bun run smoke

      - name: Run tests
        run: bun test
