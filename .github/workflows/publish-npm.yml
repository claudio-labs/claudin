name: Publish to npm

# Manual-only. Run after release.yml has tagged a version + created the
# GitHub release. This workflow trusts that release.yml validated the code
# (tests, smoke, privacy) and only does the bare minimum to ship: install
# deps, build the bundle, npm publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex: v0.1.2)'
        required: true
        type: string

concurrency:
  group: publish-npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to npm
    runs-on: ubuntu-latest
    # NOTE: trusted publishing matches ONE workflow filename per Trusted
    # Publisher entry on npmjs.com. The configured entry is release.yml, so to
    # use this manual workflow you must add a second Trusted Publisher for
    # `publish-npm.yml` (otherwise npm rejects the OIDC token with a 404).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm >= 11.5.1 for trusted publishing (avoids the
          # 'sigstore' MODULE_NOT_FOUND from self-upgrading npm in place).
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `npm publish` triggers the `prepack` script, which runs
      # `build:release` (CLAUDIN_RELEASE_BUILD=1). Running a separate
      # `bun run build` before publish would produce dev-mode chunks that
      # survive into the tarball alongside the release chunks (the dist/
      # chunks dir was kept across rebuilds for local-CLI safety). Trust
      # prepack to build — single source of truth for the published bundle.
      - name: Publish to npm
        run: npm publish --access public

      - name: Publish summary
        run: |
          {
            echo "## Published ${{ inputs.tag }}"
            echo
            echo "- npm: https://www.npmjs.com/package/@claudiolabs/claudin"
            echo "- install: \`npm install -g @claudiolabs/claudin\`"
          } >> "$GITHUB_STEP_SUMMARY"
