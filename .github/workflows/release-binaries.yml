name: Release (native binaries)

# THE release workflow. Builds per-platform native binaries (Bun --compile) on
# their own OS runners, assembles the npm wrapper + per-platform packages, and
# publishes all of them. This is the sole path that publishes @claudiolabs/claudin
# to npm — the old Node-bundle release.yml was removed so nothing can publish the
# legacy Node package to the `latest` dist-tag behind this flow's back.
#
# Publish auth = npm trusted publishing (OIDC). Each of the 9 packages needs a
# Trusted Publisher entry on npmjs.com pointing at this workflow. NOTE: the 8
# per-platform packages are brand-new — npm generally requires a package to
# exist before a Trusted Publisher can be added, so the FIRST release of each
# needs a one-time bootstrap publish (granular token) before OIDC takes over.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump (none keeps the current version)'
        required: true
        type: choice
        default: patch
        options: [none, patch, minor, major]

concurrency:
  group: release-binaries
  cancel-in-progress: false

jobs:
  # ── 1. Bump version, changelog, tag, create the GitHub release ────────────
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_CHANGELOG_TOKEN }}
      - name: Configure git identity
        run: |
          git config user.name "claudin-release-bot"
          git config user.email "release@claudin.local"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve version
        id: bump
        run: |
          if [ "${{ inputs.bump }}" = "none" ]; then
            CURRENT=$(node -p "require('./package.json').version")
            NEW_TAG="v${CURRENT}"
          else
            NEW_TAG=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          fi
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$PREV_TAG" ]; then
            RANGE=""
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          # Insert a zero-width space after every '@' in commit subjects so that
          # literal mentions like "@opentelemetry" don't trigger GitHub's own
          # auto "Contributors" strip on the release page (which duplicates the
          # curated "### Contributors" section built below). The ZWSP is
          # invisible in rendered notes and in CHANGELOG.md.
          ZWSP=$'\u200b'
          # shellcheck disable=SC2086
          COMMITS=$(git log $RANGE --pretty='- %s (%h)' --no-merges | sed "s/@/@${ZWSP}/g")
          # Credit contributors by their real GitHub identity (avatar + @handle),
          # resolved from the commit authors' logins via the API. Fall back to the
          # git author name for any commit whose email isn't linked to a GitHub
          # account. Release/CI bots are dropped.
          if [ -n "$PREV_TAG" ]; then
            LOGINS=$(gh api --paginate "repos/${REPO}/compare/${PREV_TAG}...${HEAD_SHA}" \
              --jq '.commits[].author.login // empty' 2>/dev/null || true)
          else
            LOGINS=$(gh api --paginate "repos/${REPO}/commits?sha=${HEAD_SHA}" \
              --jq '.[].author.login // empty' 2>/dev/null || true)
          fi
          LOGINS=$(printf '%s\n' "$LOGINS" | grep -viE '\[bot\]|-bot$|github-actions' | sed '/^$/d' | sort -u)
          if [ -n "$LOGINS" ]; then
            CONTRIBUTORS=$(printf '%s\n' "$LOGINS" | while IFS= read -r u; do
              printf -- '- <a href="https://github.com/%s"><img src="https://github.com/%s.png?size=40" width="20" height="20" alt="@%s"></a> <a href="https://github.com/%s">@%s</a>\n' "$u" "$u" "$u" "$u" "$u"
            done)
          else
            # shellcheck disable=SC2086
            CONTRIBUTORS=$(git log $RANGE --no-merges --pretty='%an' \
              | grep -viE 'release-bot|github-actions' \
              | sort -u | sed 's/^/- /')
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "## ${{ steps.bump.outputs.tag }}"
            echo
            if [ -z "$COMMITS" ]; then
              echo "_No user-facing commits since previous tag._"
            else
              echo "$COMMITS"
            fi
            if [ -n "$CONTRIBUTORS" ]; then
              echo
              echo "### Contributors"
              echo
              echo "$CONTRIBUTORS"
            fi
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"
      - name: Update CHANGELOG.md (this repo)
        env:
          BODY: ${{ steps.changelog.outputs.body }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SECTION=$(mktemp)
          {
            echo "## ${TAG} — ${DATE}"
            echo
            # BODY already starts with a "## <tag>" heading; drop it so we don't
            # duplicate the heading, then drop the leading blank line.
            printf '%s\n' "$BODY" | sed '1{/^## /d;}' | sed '1{/^$/d;}'
            echo
          } > "$SECTION"
          if [ -f CHANGELOG.md ] && head -1 CHANGELOG.md | grep -q '^# '; then
            # Preserve the top-level "# Changelog" title: insert the new section
            # right after it, keeping the newest release near the top.
            { head -1 CHANGELOG.md; echo; cat "$SECTION"; tail -n +2 CHANGELOG.md; } > CHANGELOG.md.new
          else
            { cat "$SECTION"; [ -f CHANGELOG.md ] && cat CHANGELOG.md; } > CHANGELOG.md.new
          fi
          mv CHANGELOG.md.new CHANGELOG.md
      - name: Commit bump + changelog + tag + push
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          git add CHANGELOG.md
          if [ "${{ inputs.bump }}" != "none" ]; then
            git add package.json
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit (changelog + version unchanged)"
          else
            git commit -m "chore(release): ${TAG}"
            git push origin HEAD:refs/heads/main
          fi
          if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
      - name: Create/update GitHub release (notes only; binaries attached later)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.changelog.outputs.body }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          printf '%s' "$BODY" > /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi
      - name: Append changelog to claudio-labs/claudin-site
        env:
          GH_TOKEN: ${{ secrets.GH_CHANGELOG_TOKEN }}
          BODY: ${{ steps.changelog.outputs.body }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_CHANGELOG_TOKEN not set, skipping external changelog push"
            exit 0
          fi
          WORK=$(mktemp -d)
          # Clone the default branch (don't hard-code main) so this keeps working
          # regardless of what claudin-site's default branch is named.
          git clone --depth=1 \
            "https://oauth2:${GH_TOKEN}@github.com/claudio-labs/claudin-site.git" \
            "$WORK/repo"
          cd "$WORK/repo"
          DEFAULT_BRANCH=$(git symbolic-ref --short HEAD)
          git config user.name "claudin-release-bot"
          git config user.email "release@claudin.local"
          DATE=$(date -u +%Y-%m-%d)
          SECTION=$(mktemp)
          {
            echo "## ${TAG} — ${DATE}"
            echo
            # BODY already contains "## <tag>" header from the changelog step;
            # strip it so we don't duplicate the heading.
            printf '%s\n' "$BODY" | sed '1{/^## /d;}' | sed '1{/^$/d;}'
            echo
          } > "$SECTION"
          if [ -f CHANGELOG.md ] && head -1 CHANGELOG.md | grep -q '^# '; then
            # Preserve a top-level "# Changelog" title if the site already has one.
            { head -1 CHANGELOG.md; echo; cat "$SECTION"; tail -n +2 CHANGELOG.md; } > CHANGELOG.md.new
          else
            { cat "$SECTION"; [ -f CHANGELOG.md ] && cat CHANGELOG.md; } > CHANGELOG.md.new
          fi
          mv CHANGELOG.md.new CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git commit -m "chore(changelog): ${TAG}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

  # ── 2. Native build matrix — one binary per platform, smoke-tested ────────
  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04, target: bun-linux-x64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, target: bun-linux-arm64 }
          - { platform: linux-x64-musl, runner: ubuntu-24.04, target: bun-linux-x64-musl, container: 'oven/bun:1.3.11-alpine' }
          # linux-arm64-musl is NOT here: GitHub only runs JS actions (checkout,
          # upload-artifact) in Alpine containers on x64 — on arm64 they fail with
          # "JavaScript Actions in Alpine containers are only supported on x64".
          # It gets its own job below that keeps JS actions on the glibc host and
          # compiles inside the musl container via `docker run`.
          # darwin-x64 is cross-compiled on an arm64 mac (macos-14): the Intel
          # macos-13 runners are being retired and queue for hours. Bun cross-
          # compiles the binary and vendor-ripgrep.ts fetches the x64 rg. The
          # x64 binary can't be run on the arm64 host, so its smoke test is
          # skipped (matrix.cross); darwin-arm64's native smoke covers the code.
          - { platform: darwin-x64, runner: macos-14, target: bun-darwin-x64, cross: true }
          - { platform: darwin-arm64, runner: macos-14, target: bun-darwin-arm64 }
          - { platform: win32-x64, runner: windows-latest, target: bun-windows-x64 }
          - { platform: win32-arm64, runner: windows-11-arm, target: bun-windows-arm64 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    steps:
      # Alpine (musl) containers ship busybox sh only — add bash (for shell:bash
      # steps) and git (for actions/checkout). Runs before checkout.
      - name: Prepare Alpine container
        if: ${{ matrix.container }}
        run: apk add --no-cache bash git tar
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Set up Bun (non-container runners)
        if: ${{ !matrix.container }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile native binary (${{ matrix.target }})
        shell: bash
        env:
          CLAUDIN_COMPILE: '1'
          CLAUDIN_RELEASE_BUILD: '1'
          CLAUDIN_COMPILE_TARGET: ${{ matrix.target }}
        run: bun run scripts/build.ts
      - name: Vendor ripgrep beside the binary
        shell: bash
        env:
          CLAUDIN_COMPILE_TARGET: ${{ matrix.target }}
        run: bun run scripts/vendor-ripgrep.ts
      - name: Vendor sharp beside the binary
        shell: bash
        env:
          CLAUDIN_COMPILE_TARGET: ${{ matrix.target }}
        run: bun run scripts/vendor-sharp.ts
      - name: Smoke test (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          BIN="dist/bin/${{ matrix.platform }}/claudin"
          case "${{ matrix.platform }}" in win32-*) BIN="$BIN.exe";; esac
          "$BIN" --version
          "$BIN" --help >/dev/null
      - name: Upload platform payload
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}
          path: dist/bin/${{ matrix.platform }}/
          retention-days: 3

  # ── 2b. linux-arm64-musl — JS actions on the host, musl build via docker ──
  # Can't use a job-level Alpine container on arm64 (JS actions unsupported), so
  # checkout + upload run on the glibc arm64 host and the whole musl build runs
  # inside `docker run oven/bun:...-alpine` (pulls the arm64 image on this host).
  build-arm64-musl:
    needs: version
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Compile + vendor + smoke inside arm64 Alpine
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/w -w /w \
            -e CLAUDIN_COMPILE=1 \
            -e CLAUDIN_RELEASE_BUILD=1 \
            -e CLAUDIN_COMPILE_TARGET=bun-linux-arm64-musl \
            oven/bun:1.3.11-alpine sh -c '
              set -e
              apk add --no-cache bash tar
              bun install --frozen-lockfile
              bun run scripts/build.ts
              bun run scripts/vendor-ripgrep.ts
              bun run scripts/vendor-sharp.ts
              BIN=dist/bin/linux-arm64-musl/claudin
              "$BIN" --version
              "$BIN" --help >/dev/null
            '
      - name: Reclaim ownership from the container (root) for upload
        run: sudo chown -R "$(id -u):$(id -g)" dist
      - name: Upload platform payload
        uses: actions/upload-artifact@v7
        with:
          name: bin-linux-arm64-musl
          path: dist/bin/linux-arm64-musl/
          retention-days: 3

  # ── 3. Assemble + publish all packages, attach binaries to the release ────
  publish:
    needs: [version, build, build-arm64-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm ≥11.5.1 for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Node fallback bundle
        run: CLAUDIN_RELEASE_BUILD=1 bun run scripts/build.ts
      - name: Verify no phone-home (gates publish)
        # Scans dist/cli.mjs. The compiled binaries and this bundle are built from
        # the same src/ through the same noTelemetryPlugin, so a clean bundle is
        # strong evidence for the binaries too. TODO: scan the binary directly.
        run: bun run verify:privacy
      - name: Download all platform payloads
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist/bin
      - name: Flatten artifact dirs (bin-<platform>/ → <platform>/)
        run: |
          cd dist/bin
          for d in bin-*; do mv "$d" "${d#bin-}"; done
      - name: Assemble packages
        run: bun run scripts/assemble-packages.ts "${{ needs.version.outputs.version }}"
      - name: Publish per-platform packages, then the wrapper LAST
        run: |
          set -e
          # Platform packages first so the wrapper's optionalDependencies resolve
          # the moment it goes live; a failed leg never flips `latest` to a broken
          # wrapper. Idempotent: skip a version already on npm.
          for dir in dist/packages/claudin-*; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VER=$(node -p "require('./$dir/package.json').version")
            if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
              echo "${NAME}@${VER} already published, skipping"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
          # Wrapper last.
          NAME=$(node -p "require('./dist/packages/claudin/package.json').name")
          VER=$(node -p "require('./dist/packages/claudin/package.json').version")
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "${NAME}@${VER} already published, skipping"
          else
            (cd dist/packages/claudin && npm publish --access public)
          fi
      - name: Attach per-architecture binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -e
          root="$PWD"
          mkdir -p release-assets
          # One archive per platform: the native binary + its vendored rg. Windows
          # gets a .zip (native to the OS); everything else a .tar.gz (preserves
          # the executable bit). Version in the name mirrors the dist-vX.Y.Z asset.
          for dir in dist/bin/*/; do
            plat=$(basename "$dir")
            if [[ "$plat" == win32-* ]]; then
              (cd "$dir" && zip -qr "$root/release-assets/claudin-${TAG}-${plat}.zip" .)
            else
              tar -czf "release-assets/claudin-${TAG}-${plat}.tar.gz" -C "$dir" .
            fi
          done
          # Combined checksums for scripted verification (GitHub also shows a
          # per-asset sha256 digest in the release UI).
          (cd release-assets && sha256sum claudin-* > SHA256SUMS.txt)
          gh release upload "$TAG" release-assets/* --clobber
      - name: Summary
        run: |
          {
            echo "## Released ${{ needs.version.outputs.tag }} (native binaries)"
            echo "- npm: https://www.npmjs.com/package/@claudiolabs/claudin"
            echo "- install: \`npm install -g @claudiolabs/claudin\`"
          } >> "$GITHUB_STEP_SUMMARY"
