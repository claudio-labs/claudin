name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de bump semver (none mantém a versão atual — útil pro primeiro release)'
        required: true
        type: choice
        default: patch
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC token for npm trusted publishing (no NPM_TOKEN needed). Must match
      # the Trusted Publisher configured on npmjs.com for this repo + workflow.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Push the version-bump/changelog commit and tag with a PAT whose
          # owner is in the `main` ruleset bypass list. The default GITHUB_TOKEN
          # (github-actions bot) is NOT in that list, so its direct push to main
          # is rejected by "Changes must be made through a pull request" (GH013).
          token: ${{ secrets.GH_CHANGELOG_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "claudin-release-bot"
          git config user.email "release@claudin.local"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.5.1, which trusted publishing needs.
          # Self-upgrading npm in place (npm i -g npm@latest) leaves the
          # provenance path missing 'sigstore', so pick a Node that already
          # ships a new enough npm instead.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke + build
        run: bun run smoke

      - name: Resolve version
        id: bump
        run: |
          if [ "${{ inputs.bump }}" = "none" ]; then
            CURRENT=$(node -p "require('./package.json').version")
            NEW_TAG="v${CURRENT}"
            echo "Keeping current version ${NEW_TAG}"
          else
            NEW_TAG=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
            echo "Bumped to ${NEW_TAG}"
          fi
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$PREV_TAG" ]; then
            RANGE=""
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          # shellcheck disable=SC2086
          COMMITS=$(git log $RANGE --pretty='- %s (%h)' --no-merges)
          # Credit contributors by their real GitHub identity (avatar + @handle),
          # resolved from the commit authors' logins via the API. Fall back to the
          # git author name for any commit whose email isn't linked to a GitHub
          # account. Release/CI bots are dropped.
          if [ -n "$PREV_TAG" ]; then
            LOGINS=$(gh api --paginate "repos/${REPO}/compare/${PREV_TAG}...${HEAD_SHA}" \
              --jq '.commits[].author.login // empty' 2>/dev/null || true)
          else
            LOGINS=$(gh api --paginate "repos/${REPO}/commits?sha=${HEAD_SHA}" \
              --jq '.[].author.login // empty' 2>/dev/null || true)
          fi
          LOGINS=$(printf '%s\n' "$LOGINS" | grep -viE '\[bot\]|-bot$|github-actions' | sed '/^$/d' | sort -u)
          if [ -n "$LOGINS" ]; then
            CONTRIBUTORS=$(printf '%s\n' "$LOGINS" | while IFS= read -r u; do
              printf -- '- <a href="https://github.com/%s"><img src="https://github.com/%s.png?size=40" width="20" height="20" alt="@%s"></a> <a href="https://github.com/%s">@%s</a>\n' "$u" "$u" "$u" "$u" "$u"
            done)
          else
            # shellcheck disable=SC2086
            CONTRIBUTORS=$(git log $RANGE --no-merges --pretty='%an' \
              | grep -viE 'release-bot|github-actions' \
              | sort -u | sed 's/^/- /')
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "## ${{ steps.bump.outputs.tag }}"
            echo
            if [ -z "$COMMITS" ]; then
              echo "_No user-facing commits since previous tag._"
            else
              echo "$COMMITS"
            fi
            if [ -n "$CONTRIBUTORS" ]; then
              echo
              echo "### Contributors"
              echo
              echo "$CONTRIBUTORS"
            fi
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md (this repo)
        env:
          BODY: ${{ steps.changelog.outputs.body }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SECTION=$(mktemp)
          {
            echo "## ${TAG} — ${DATE}"
            echo
            # BODY already starts with a "## <tag>" heading; drop it so we don't
            # duplicate the heading, then drop the leading blank line.
            printf '%s\n' "$BODY" | sed '1{/^## /d;}' | sed '1{/^$/d;}'
            echo
          } > "$SECTION"
          if [ -f CHANGELOG.md ] && head -1 CHANGELOG.md | grep -q '^# '; then
            # Preserve the top-level "# Changelog" title: insert the new section
            # right after it, keeping the newest release near the top.
            { head -1 CHANGELOG.md; echo; cat "$SECTION"; tail -n +2 CHANGELOG.md; } > CHANGELOG.md.new
          else
            { cat "$SECTION"; [ -f CHANGELOG.md ] && cat CHANGELOG.md; } > CHANGELOG.md.new
          fi
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Commit (changelog + bump), tag, push
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          git add CHANGELOG.md
          if [ "${{ inputs.bump }}" != "none" ]; then
            git add package.json
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit (changelog + version unchanged)"
          else
            git commit -m "chore(release): ${TAG}"
            git push origin HEAD:refs/heads/main
          fi
          # Idempotent tag: skip if already on remote (release.yml may have
          # failed mid-flow on a previous attempt and we want to retry without
          # manual cleanup).
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on remote, skipping push"
          else
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create or update GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.changelog.outputs.body }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          # With code-splitting, dist/cli.mjs is a 10 KB facade that imports
          # 412 chunks from dist/chunks/. Shipping cli.mjs alone would yield
          # a broken binary, so we tar the whole dist/ (excluding sourcemaps).
          TARBALL="dist-${TAG}.tar.gz"
          tar --exclude='*.map' -czf "$TARBALL" -C dist .
          printf '%s' "$BODY" > /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes + asset"
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "$TARBALL" --clobber
          else
            gh release create "$TAG" "$TARBALL" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Append changelog to claudio-labs/claudin-site
        env:
          GH_TOKEN: ${{ secrets.GH_CHANGELOG_TOKEN }}
          BODY: ${{ steps.changelog.outputs.body }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_CHANGELOG_TOKEN not set, skipping external changelog push"
            exit 0
          fi
          WORK=$(mktemp -d)
          # Clone the default branch (don't hard-code main) so this keeps working
          # regardless of what claudin-site's default branch is named.
          git clone --depth=1 \
            "https://oauth2:${GH_TOKEN}@github.com/claudio-labs/claudin-site.git" \
            "$WORK/repo"
          cd "$WORK/repo"
          DEFAULT_BRANCH=$(git symbolic-ref --short HEAD)
          git config user.name "claudin-release-bot"
          git config user.email "release@claudin.local"
          DATE=$(date -u +%Y-%m-%d)
          SECTION=$(mktemp)
          {
            echo "## ${TAG} — ${DATE}"
            echo
            # BODY already contains "## <tag>" header from the changelog step;
            # strip it so we don't duplicate the heading.
            printf '%s\n' "$BODY" | sed '1{/^## /d;}' | sed '1{/^$/d;}'
            echo
          } > "$SECTION"
          if [ -f CHANGELOG.md ] && head -1 CHANGELOG.md | grep -q '^# '; then
            # Preserve a top-level "# Changelog" title if the site already has one.
            { head -1 CHANGELOG.md; echo; cat "$SECTION"; tail -n +2 CHANGELOG.md; } > CHANGELOG.md.new
          else
            { cat "$SECTION"; [ -f CHANGELOG.md ] && cat CHANGELOG.md; } > CHANGELOG.md.new
          fi
          mv CHANGELOG.md.new CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git commit -m "chore(changelog): ${TAG}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Publish to npm
        run: |
          # Trusted publishing (OIDC): the npm CLI auto-detects the GitHub
          # id-token and authenticates without a stored NPM_TOKEN. Requires the
          # id-token: write permission above, npm >= 11.5.1, and a Trusted
          # Publisher on npmjs.com matching this repo + workflow (release.yml).
          # Provenance attestations are generated automatically.
          # Idempotent: skip if this version is already published.
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} already on npm, skipping publish"
          else
            npm publish --access public
            echo "Published ${PKG_NAME}@${PKG_VERSION}"
          fi

      - name: Release summary
        run: |
          {
            echo "## Released ${{ steps.bump.outputs.tag }}"
            echo
            echo "- Tag: ${{ steps.bump.outputs.tag }}"
            echo "- Version: ${{ steps.bump.outputs.version }}"
            echo "- Release page: https://github.com/${{ github.repository }}/releases/tag/${{ steps.bump.outputs.tag }}"
            echo "- npm: https://www.npmjs.com/package/@claudiolabs/claudin"
            echo "- install: \`npm install -g @claudiolabs/claudin@${{ steps.bump.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
